[project]
name = "msflags"
version = "0.1.0"
description = "AlphaZero-style AI for 1-on-1 Minesweeper (Minesweeper Flags) with a web UI"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msflags"]

[tool.pytest.ini_options]
testpaths = ["tests"]
